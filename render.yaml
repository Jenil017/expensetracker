# Render Blueprint for Khatabook (Express API + React PWA + Neon Postgres).
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
services:
  - type: web
    name: transaction-buddy
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_VERSION
        value: "20"
