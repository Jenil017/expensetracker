# Render Blueprint for the Hisab web service (Express API + built React app + Neon Postgres).
# Deploy: https://dashboard.render.com -> New -> Blueprint -> connect this repo.
# Render reads this file and prompts you for DATABASE_URL and APP_PASSWORD
# (they are NOT stored here, so they stay out of git).
services:
  - type: web
    name: hisab
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: "20"
